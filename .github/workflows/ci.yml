name: LogiRoute AI — MLOps CI Pipeline

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-verify:
    name: ML Models, Optimization & API Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run ML & Optimization Test Suite
        run: |
          pytest -v

      - name: Run CLI Benchmark Smoke Test
        run: |
          python -m logiroute.cli --evaluate
