[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logiroute"
version = "1.0.0"
description = "Enterprise AI/ML Supply Chain & Logistics Optimization Platform (CVRPTW, Quantile Demand Forecasting, Traffic-Aware ETA, Stochastic Inventory Optimization)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "LogiRoute AI Engineering"}
]
keywords = [
    "supply-chain",
    "logistics",
    "vehicle-routing-problem",
    "cvrptw",
    "demand-forecasting",
    "eta-prediction",
    "inventory-optimization",
    "machine-learning",
    "operations-research",
    "fastapi"
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
logiroute = "logiroute.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["logiroute*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
